version: 0.2

phases:
  pre_build:
    commands:
      - aws --version
      - jq --version

  build:
    commands:
      - |
          set -euo pipefail
          trap 'rc=$?; echo "ERROR (rc=${rc}) at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR
          if [ "${DEBUG:-false}" = "true" ]; then set -x; fi

          SNAPSHOT_TS="$(date -u +%Y%m%d%H%M)"
          PRODUCT_RESOURCE_NAME="${PRODUCT_RESOURCE_NAME:-cdp-sirsi}"

          PROD_CLUSTER_ID="${PRODUCT_RESOURCE_NAME}-fts-cluster"
          PROD_SNAPSHOT_ID="${PRODUCT_RESOURCE_NAME}-fts-prod-${SNAPSHOT_TS}"
          PROD_SHARE_SNAPSHOT_ID="${PRODUCT_RESOURCE_NAME}-fts-prod-share-${SNAPSHOT_TS}"
          PROD_SHARE_SNAPSHOT_ARN="arn:aws:rds:${AWS_REGION}:${PROD_ACCOUNT_ID}:cluster-snapshot:${PROD_SHARE_SNAPSHOT_ID}"

          PROD_KMS_KEY_ID="alias/rds-snapshot-copy-cdp-sirsi-production"

          use_execution_role_creds() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          }

          assume_role() {
            local account_id="$1"
            local env_name="$2"

            aws sts assume-role \
              --role-arn "arn:aws:iam::${account_id}:role/${PRODUCT_RESOURCE_NAME}-${env_name}-terraform" \
              --role-session-name "CodeBuild-${env_name}-fts-db-weekly-refresh" \
              > /tmp/assumed_role.json

            export AWS_ACCESS_KEY_ID="$(jq -r '.Credentials.AccessKeyId' /tmp/assumed_role.json)"
            export AWS_SECRET_ACCESS_KEY="$(jq -r '.Credentials.SecretAccessKey' /tmp/assumed_role.json)"
            export AWS_SESSION_TOKEN="$(jq -r '.Credentials.SessionToken' /tmp/assumed_role.json)"
          }

          wait_rds_cluster_snapshot_available() {
            local snapshot_id_or_arn="$1"
            local timeout_seconds="${2:-10800}" # 3h (matches CodeBuild timeout)
            local sleep_seconds="${3:-60}"
            local start_epoch now_epoch elapsed status

            start_epoch="$(date +%s)"
            while true; do
              status="$(aws rds describe-db-cluster-snapshots \
                --db-cluster-snapshot-identifier "${snapshot_id_or_arn}" \
                --query 'DBClusterSnapshots[0].Status' \
                --output text 2>/dev/null || true)"

              now_epoch="$(date +%s)"
              elapsed="$((now_epoch - start_epoch))"

              if [ "${status}" = "available" ]; then
                echo "==> RDS cluster snapshot ${snapshot_id_or_arn} is available (waited ${elapsed}s)"
                return 0
              fi

              if [ "${status}" = "failed" ]; then
                echo "ERROR: RDS cluster snapshot ${snapshot_id_or_arn} entered failed status" >&2
                aws rds describe-db-cluster-snapshots --db-cluster-snapshot-identifier "${snapshot_id_or_arn}" --output json >&2 || true
                return 1
              fi

              if [ "${elapsed}" -ge "${timeout_seconds}" ]; then
                echo "ERROR: Timed out waiting for RDS cluster snapshot ${snapshot_id_or_arn} to become available after ${elapsed}s (status=${status})" >&2
                aws rds describe-db-cluster-snapshots --db-cluster-snapshot-identifier "${snapshot_id_or_arn}" --output json >&2 || true
                return 1
              fi

              echo "==> Waiting for RDS cluster snapshot ${snapshot_id_or_arn} (status=${status}, elapsed=${elapsed}s)"
              sleep "${sleep_seconds}"
            done
          }

          echo "==> Production: create snapshot ${PROD_SNAPSHOT_ID} from ${PROD_CLUSTER_ID}"
          use_execution_role_creds
          assume_role "${PROD_ACCOUNT_ID}" "production"
          aws sts get-caller-identity

          aws rds create-db-cluster-snapshot \
            --db-cluster-identifier "${PROD_CLUSTER_ID}" \
            --db-cluster-snapshot-identifier "${PROD_SNAPSHOT_ID}"
          wait_rds_cluster_snapshot_available "${PROD_SNAPSHOT_ID}"

          echo "==> Production: copy snapshot with share KMS (${PROD_KMS_KEY_ID}) to ${PROD_SHARE_SNAPSHOT_ID}"
          aws rds copy-db-cluster-snapshot \
            --source-db-cluster-snapshot-identifier "${PROD_SNAPSHOT_ID}" \
            --target-db-cluster-snapshot-identifier "${PROD_SHARE_SNAPSHOT_ID}" \
            --kms-key-id "${PROD_KMS_KEY_ID}" \
            --copy-tags
          wait_rds_cluster_snapshot_available "${PROD_SHARE_SNAPSHOT_ID}"

          echo "==> Production: share snapshot with staging account ${STAGING_ACCOUNT_ID}"
          aws rds modify-db-cluster-snapshot-attribute \
            --db-cluster-snapshot-identifier "${PROD_SHARE_SNAPSHOT_ID}" \
            --attribute-name restore \
            --values-to-add "${STAGING_ACCOUNT_ID}"

          mkdir -p context
          jq -n \
            --arg snapshot_ts "${SNAPSHOT_TS}" \
            --arg product_resource_name "${PRODUCT_RESOURCE_NAME}" \
            --arg aws_region "${AWS_REGION}" \
            --arg prod_account_id "${PROD_ACCOUNT_ID}" \
            --arg staging_account_id "${STAGING_ACCOUNT_ID}" \
            --arg prod_cluster_id "${PROD_CLUSTER_ID}" \
            --arg prod_snapshot_id "${PROD_SNAPSHOT_ID}" \
            --arg prod_share_snapshot_id "${PROD_SHARE_SNAPSHOT_ID}" \
            --arg prod_share_snapshot_arn "${PROD_SHARE_SNAPSHOT_ARN}" \
            '{snapshot_ts:$snapshot_ts,product_resource_name:$product_resource_name,aws_region:$aws_region,prod_account_id:$prod_account_id,staging_account_id:$staging_account_id,prod_cluster_id:$prod_cluster_id,prod_snapshot_id:$prod_snapshot_id,prod_share_snapshot_id:$prod_share_snapshot_id,prod_share_snapshot_arn:$prod_share_snapshot_arn}' \
            > context/prod_context.json

          echo "==> Wrote context/prod_context.json"

artifacts:
  files:
    - context/prod_context.json
