# clamd configuration for the clamd sidecar in the fts-app ECS task.
# Replaces the image's default /etc/clamav/clamd.conf entirely.

# fts-app (ClamAvFileScanner) scans over TCP INSTREAM. Bind to loopback only: the sidecar shares
# the task's network namespace, so nothing outside the task can reach clamd.
TCPSocket 3310
TCPAddr 127.0.0.1

# The image's entrypoint waits for this socket to appear before it considers clamd started, and
# exits the container if it never does. Keep it even though fts-app uses TCP.
LocalSocket /tmp/clamd.sock

User clamav
Foreground yes

# fts-app accepts uploads up to 100MB, so the INSTREAM and scan limits must exceed that or large
# clean files would be aborted by clamd and rejected by the fail-closed scanner.
StreamMaxLength 150M
MaxScanSize 150M
MaxFileSize 150M

# No LogFile: clamd logs to stderr, which goes to CloudWatch (/ecs/fts-app, stream prefix clamav).
# LogClean records every scan result, not just detections. Scans arrive via INSTREAM, so clamd logs
# "stream" rather than the upload filename; ClamAvFileScanner logs the filename.
LogTime yes
LogClean yes
LogSyslog no
